    <!-- Extension Error Isolation Barrier -->
    <script>
      (function() {
        function isBenignExtensionError(err, msg, filename) {
          try {
            var str = [
              msg || '',
              filename || '',
              err && err.message ? err.message : '',
              err && err.stack ? err.stack : ''
            ].join(' ').toLowerCase();
            return (
              str.indexOf('metamask') !== -1 ||
              str.indexOf('chrome-extension://') !== -1 ||
              str.indexOf('inpage.js') !== -1 ||
              str.indexOf('evmprovider') !== -1
            );
          } catch (e) {
            return false;
          }
        }
        window.addEventListener('error', function(event) {
          if (event && isBenignExtensionError(event.error, event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (isBenignExtensionError(reason, reason && reason.message ? reason.message : '', '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
